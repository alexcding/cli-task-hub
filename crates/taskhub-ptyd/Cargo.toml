[package]
name = "taskhub-ptyd"
version = "1.0.0"
edition = "2021"
rust-version = "1.77.2"
license = "ISC"

[features]
# Enable only for snapshot integration builds until the native surface can import it.
terminal-snapshots = ["dep:taskhub-vt"]

[dependencies]
taskhub-vt = { path = "../taskhub-vt", optional = true }
base64 = "0.22.1"
portable-pty = "0.9.0"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
